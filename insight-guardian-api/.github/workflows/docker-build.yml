name: Docker Build and Test

on:
  push:
    branches: [ "main", "building" ] # Triggers the workflow on push to main or develop branches
  pull_request:
    branches: [ "main", "building" ] # Also triggers on pull requests to main

jobs:
  build:
    runs-on: ubuntu-latest # Use a GitHub-hosted runner with Linux

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 # Step 1: Get the code from your repo

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3 # Step 2: Set up a more advanced Docker builder

      - name: Build the Docker image
        run: docker build . --file Dockerfile --tag my-image-name:$(date +%s) # Step 3: Run the docker build command
